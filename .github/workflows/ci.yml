name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build -o /tmp/gemhunter ./cmd/gemhunter
          go build -o /tmp/gemfinder-mcp ./cmd/mcp
